# EVProfile development environment.
#
# This file is intentionally committed: it describes how to build the project, not a
# specific machine. Create a gitignored mise.local.toml for local overrides.
#
#   mise install       installs the JDK
#   mise run bootstrap installs the Android SDK when missing
#   mise run test      runs unit tests for both channels
#   mise tasks         lists all tasks
#
# AGP 8.5.2 requires Java 17. Pinning the JDK avoids an unclear class-version failure
# when the machine default is a newer JDK.

[tools]
java = "17"

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Android/Sdk"
# Gradle reads JAVA_HOME. Mise already sets it through [tools]; the SDK tool order is
# made explicit in PATH.
_.path = [
    "{{env.HOME}}/Android/Sdk/platform-tools",
    "{{env.HOME}}/Android/Sdk/cmdline-tools/latest/bin",
]

# SDK version required by app/build.gradle.kts (compileSdk = 34).
COMPILE_SDK = "34"
BUILD_TOOLS = "34.0.0"

# Gradle must use Mise's JDK. Without -Dorg.gradle.java.home, Gradle may reuse a daemon
# started by the VS Code Java extension with a JRE 21 that lacks jlink, causing an
# unrelated JdkImageTransform failure.
# ── Emulator ──────────────────────────────────────────────────────────────────
#
# Fidelity warning: the vehicle runs AAOS 9 (API 28). Google publishes no Automotive
# system image below API 33, as verified with sdkmanager --list. No emulator reproduces
# both the MG4 OS version and vehicle API, so two profiles cover one axis each:
#
#   emulator-car     API 33 Automotive: has CarPropertyManager but the wrong OS version.
#                    Use it for service lifecycle and vehicle-access paths. SAIC vendor
#                    properties (0x216xxxxx: SOC, range) do not exist, so reads fail normally.
#   emulator-screen  API 28 tablet: correct OS version and screen (1920x1080 @ 160dpi,
#                    12.8-inch HD like the MG4), but no vehicle service. Use it for UI,
#                    layouts and density.
#
# Neither profile replaces on-vehicle testing.
# Target density: 160 dpi.
# Screen: 12.8-inch 1920x1080. Reference firmware: SWI68-29958-1300R69.

EMU_CAR_AVD = "evprofile-car"
EMU_CAR_IMAGE = "system-images;android-33;android-automotive;x86_64"
EMU_SCREEN_AVD = "evprofile-screen"
EMU_SCREEN_IMAGE = "system-images;android-28;google_apis;x86_64"
EMU_WIDTH = "1920"
EMU_HEIGHT = "1080"
EMU_DENSITY = "160"


[tasks.bootstrap]
description = "Install the Android SDK platform and build tools when missing"
run = """
set -e
if [ -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
  echo "SDK $COMPILE_SDK is already installed"
  exit 0
fi
mkdir -p "$ANDROID_HOME"
if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
  echo "Downloading Android command-line tools…"
  tmp=$(mktemp -d)
  curl -sSL -o "$tmp/tools.zip" \
    https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  unzip -q "$tmp/tools.zip" -d "$tmp"
  mkdir -p "$ANDROID_HOME/cmdline-tools"
  mv "$tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
  rm -rf "$tmp"
fi
yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
  "platform-tools" "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS"
echo "sdk.dir=$ANDROID_HOME" > local.properties
echo "SDK installed and local.properties written"
"""

[tasks.build]
description = "Build the offline stable debug channel"
run = './gradlew -Dorg.gradle.java.home=$JAVA_HOME assembleStableDebug'

[tasks.test]
description = "Run JVM unit tests for both channels"
run = './gradlew -Dorg.gradle.java.home=$JAVA_HOME testStableDebugUnitTest testUnstableDebugUnitTest'

[tasks.lint]
description = "Run Android lint"
run = './gradlew -Dorg.gradle.java.home=$JAVA_HOME lintStableDebug lintUnstableDebug'

[tasks.permissions]
description = "Check permission drift using the CI gate"
run = "bash .github/security/check-permissions.sh"

[tasks.check]
description = "Run the CI permission and test gates"
depends = ["permissions", "test"]

[tasks.release]
description = "Build both release APKs with R8; on-vehicle validation is required before publishing"
run = './gradlew -Dorg.gradle.java.home=$JAVA_HOME assembleStableRelease assembleUnstableRelease'

[tasks.clean]
run = './gradlew -Dorg.gradle.java.home=$JAVA_HOME clean'

[tasks.emulator-setup]
description = "Install emulator system images and create both AVDs"
run = '''
set -e
SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

if [ ! -e /dev/kvm ]; then
  echo "ERROR: /dev/kvm is missing; the emulator cannot use hardware acceleration." >&2
  echo "On WSL2, enable nested virtualization in Windows." >&2
  exit 1
fi
if ! id -nG | tr ' ' '\n' | grep -qx kvm; then
  echo "WARNING: the current user is not in the kvm group. Fix with:" >&2
  echo "  sudo usermod -aG kvm $USER   # then log in again" >&2
fi

yes | "$SDK" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
"$SDK" --sdk_root="$ANDROID_HOME" "emulator" "platform-tools" "$EMU_CAR_IMAGE" "$EMU_SCREEN_IMAGE"

create_avd() {
  name="$1"; image="$2"; device="$3"
  if "$AVDM" list avd 2>/dev/null | grep -q "Name: $name"; then
    echo "AVD $name already exists"
  else
    echo no | "$AVDM" create avd -n "$name" -k "$image" -d "$device" --force
  fi
  cfg="$HOME/.android/avd/$name.avd/config.ini"
  # MG4 screen geometry. Without this, the AVD keeps the generic profile density and
  # layouts do not match what the driver sees.
  sed -i '/^hw.lcd/d;/^disk.dataPartition.size/d' "$cfg"
  {
    echo "hw.lcd.width=$EMU_WIDTH"
    echo "hw.lcd.height=$EMU_HEIGHT"
    echo "hw.lcd.density=$EMU_DENSITY"
    echo "disk.dataPartition.size=4G"
  } >> "$cfg"
  echo "Configured AVD $name at ${EMU_WIDTH}x${EMU_HEIGHT} @ ${EMU_DENSITY}dpi"
}

create_avd "$EMU_CAR_AVD" "$EMU_CAR_IMAGE" "automotive_1024p_landscape"
create_avd "$EMU_SCREEN_AVD" "$EMU_SCREEN_IMAGE" "pixel_c"
'''

[tasks.emulator-car]
description = "Start the API 33 Automotive emulator with CarPropertyManager"
run = '''
set -e
# The host GPU is not exposed reliably under WSL2.
"$ANDROID_HOME/emulator/emulator" -avd "$EMU_CAR_AVD" \
  -gpu host -no-snapshot-save -no-boot-anim &
"$ANDROID_HOME/platform-tools/adb" wait-for-device
echo "Vehicle emulator is ready."
'''

[tasks.emulator-screen]
description = "Start the API 28 MG4 screen emulator without vehicle services"
run = '''
set -e
"$ANDROID_HOME/emulator/emulator" -avd "$EMU_SCREEN_AVD" \
  -gpu host -no-snapshot-save -no-boot-anim &
"$ANDROID_HOME/platform-tools/adb" wait-for-device
echo "Screen emulator is ready."
'''

[tasks.emulator-stop]
description = "Stop the running emulator"
run = '"$ANDROID_HOME/platform-tools/adb" emu kill || true'

[tasks.run]
description = "Build, install and launch the APK on an emulator or connected vehicle"
depends = ["build"]
run = '''
set -e
ADB="$ANDROID_HOME/platform-tools/adb"
if [ -z "$($ADB devices | sed '1d' | grep -w device || true)" ]; then
  echo "No device found. Start an emulator or connect the vehicle." >&2
  exit 1
fi
# Debug builds remove sharedUserId through src/debug/AndroidManifest.xml, so the debug key
# is sufficient on an emulator. Release retains sharedUserId and the platform signature.
APK=$(ls -t app/build/outputs/apk/stable/debug/*.apk | head -1)
echo "Installing $APK"
$ADB install -r -g "$APK"
$ADB shell am start -n "com.evsuite.profile/com.evsuite.profile.MainActivity"
echo "Launched. View logs with: mise run logs"
'''

name: 🔐 Security Vulnerability
description: Report a security vulnerability (confidential)
title: "[SECURITY] "
labels: [security, confidential]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Security Vulnerability Report

        **⚠️ CONFIDENTIAL:** Do not disclose vulnerability details publicly.

        Please report security issues via private GitHub Security Advisory instead:
        1. Click "Report a vulnerability" at `/security/advisories/new`
        2. Or email: [maintainer security contact]
        3. Do **not** post details in public issues

        This template is for urgent in-scope vulnerabilities only.

  - type: checkboxes
    id: checks
    attributes:
      label: "Security Classification"
      description: "Select the vulnerability type"
      options:
        - label: "Prompt injection / malicious input not validated"
        - label: "Speed gate bypass (vehicle writes at speed > 0 km/h)"
        - label: "ADAS/AEB safety system disabled or misconfigured"
        - label: "Drive mode / regen / one-pedal changes unprotected"
        - label: "Seat/steering heat controls exposed without proper gating"
        - label: "Binder security bypass (unauthorized IHubService calls)"
        - label: "Permission escalation (uses android.uid.system improperly)"
        - label: "Code execution vulnerability"
        - label: "Data exfiltration / privacy leak"
        - label: "Other security issue affecting vehicle safety"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Vulnerability Title"
      description: "Concise title (do not include exploit details)"
      placeholder: "Speed gate can be bypassed in offline build"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Vulnerability Description"
      description: |
        High-level description (no exploit steps or proof-of-concept):
        - What is vulnerable
        - Why it matters
        - Impact on vehicle safety or security
      placeholder: |
        The speed gate in ProfileApplier does not validate vehicle speed before write.
        An attacker could apply a safety-critical profile (e.g., AEB off) while driving.
        Impact: Loss of safety-critical features during vehicle operation.
      rows: 6
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity (CVSS)"
      description: "CVSS v3.1 rating"
      options:
        - "Critical (9.0–10.0) — Immediate vehicle safety risk"
        - "High (7.0–8.9) — Significant security impact"
        - "Medium (4.0–6.9) — Moderate risk"
        - "Low (0.1–3.9) — Minor issue"
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: "Affected Projects & Versions"
      description: "Which projects and versions are affected?"
      placeholder: "EVProfile < 1.2.0 (all builds), EVHardware < 0.5.0"
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: "Suggested Remediation"
      description: "How should this be fixed?"
      placeholder: |
        1. Add `PERF_VEHICLE_SPEED` read with caching
        2. Refuse profile apply if speed > 0 km/h
        3. Return user-facing error explaining the gate
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this vulnerability will be handled according to the security policy
          required: true
        - label: I consent to coordinated disclosure and a reasonable embargo period
          required: true

name: Release

# Stable channel: tagged, offline, and installed manually. workflow_dispatch validates and
# uploads an artifact but deliberately does not publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build stable offline APK
    runs-on: ubuntu-latest
    env:
      EV_KEYSTORE_BASE64: ${{ secrets.EV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Stable releases must be tagged from main."
            exit 1
          }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Require platform keystore
        run: |
          if [ -z "$EV_KEYSTORE_BASE64" ]; then
            echo "::error::EV_KEYSTORE_BASE64 is required; refusing to publish an unsigned vehicle APK."
            exit 1
          fi

      - name: Decode platform keystore
        run: |
          printf '%s' "$EV_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/platform.keystore"
          if [ "$(head -c1 "$RUNNER_TEMP/platform.keystore" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "::error::EV_KEYSTORE_BASE64 is invalid."
            exit 1
          fi
          echo "EV_KEYSTORE=$RUNNER_TEMP/platform.keystore" >> "$GITHUB_ENV"

      - name: Verify and build stable
        env:
          EV_KEYSTORE_PASSWORD: ${{ secrets.EV_KEYSTORE_PASSWORD }}
          EV_KEY_ALIAS: ${{ secrets.EV_KEY_ALIAS }}
          EV_KEY_PASSWORD: ${{ secrets.EV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          bash .github/security/check-permissions.sh
          ./gradlew testStableDebugUnitTest lintStableDebug processStableDebugMainManifest assembleStableRelease --no-daemon
          ./gradlew processUnstableDebugMainManifest --no-daemon
          bash .github/security/check-channel-isolation.sh

      - name: Collect stable APK
        run: |
          mkdir -p dist
          ver=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          find app/build/outputs/apk -name "app-stable-release.apk" -exec cp {} "dist/EVProfile-stable-${ver}.apk" \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with: { name: evprofile-stable-apk, path: "dist/*.apk" }

      - name: Extract changelog
        id: changelog
        run: |
          {
            echo 'notes<<CHANGELOG_EOF'
            ./release-notes.sh "${{ github.ref_name }}" || ./release-notes.sh --latest
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
          body: |
            Stable/offline EVProfile release. This APK contains no updater implementation
            and declares no network permission. Installation and updates are manual.

            ### Changelog
            ${{ steps.changelog.outputs.notes }}
